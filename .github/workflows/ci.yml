name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: paper
          POSTGRES_DB: paper_trader
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paper -d paper_trader"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://paper:paper@localhost:5432/paper_trader
      SECRET_VAULT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # --- gating: the safety net ---
      - name: Tests
        run: uv run pytest -q
      # --- non-blocking: pre-existing lint/type debt (tracked, not yet a gate) ---
      - name: Lint (ruff)
        run: uv run ruff check
        continue-on-error: true
      - name: Types (mypy)
        run: uv run mypy app
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # --- gating: the safety net ---
      - name: Types (tsc)
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_API_BASE: http://localhost:8010
          NEXT_PUBLIC_WS_BASE: ws://localhost:8010
      # --- non-blocking: pre-existing lint debt ---
      - name: Lint (eslint)
        run: npx eslint .
        continue-on-error: true
